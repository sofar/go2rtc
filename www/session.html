<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>session - go2rtc</title>
    <style>
        .session-info {
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
        }
        .session-info .class-tag {
            font-size: 18px;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 12px;
            color: white;
        }
        .class-tag.person { background: #e74c3c; }
        .class-tag.car { background: #3498db; }
        .class-tag.dog { background: #8e44ad; }
        .class-tag.cat { background: #27ae60; }
        .class-tag.bird { background: #16a085; }
        .class-tag.truck { background: #2c3e50; }
        .class-tag.default { background: #e67e22; }
        .session-info .meta { color: #666; font-size: 14px; }
        .session-info .dur {
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
        }
        .status-active { color: #2a2; font-weight: bold; }
        .status-ended { color: #888; }

        .snapshots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 12px;
        }
        .snap-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
        }
        .snap-card img {
            width: 100%;
            display: block;
            background: #222;
            min-height: 150px;
        }
        .snap-card .snap-label {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: bold;
        }
        .snap-card .snap-meta {
            padding: 0 12px 8px;
            font-size: 12px;
            color: #666;
        }
        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .timeline {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }
        .timeline-thumb {
            width: 120px;
            height: 68px;
            object-fit: cover;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        .timeline-thumb.selected {
            border-color: #2ecc71;
        }
        .timeline-thumb:hover {
            border-color: #3498db;
        }
        .timeline-time {
            font-size: 10px;
            color: #888;
            text-align: center;
        }
        .timeline-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

<script src="main.js"></script>

<main>
    <div class="controls">
        <a href="events.html">&larr; back to sessions</a>
        <label><input type="checkbox" id="autorefresh" checked> auto-refresh (active only)</label>
    </div>
    <div id="session-info" class="session-info">Loading...</div>
    <div id="timeline" class="timeline"></div>
    <div class="snapshots-grid" id="snapshots"></div>
</main>

<script>
    const params = new URLSearchParams(location.search);
    const sessionRegion = params.get('region');
    const sessionClass = params.get('class');
    const sessionID = params.get('id');
    const infoDiv = document.getElementById('session-info');
    const snapshotsDiv = document.getElementById('snapshots');
    const timelineDiv = document.getElementById('timeline');

    function tagClass(cls) {
        const known = ['person','car','dog','cat','bird','truck'];
        return 'class-tag ' + (known.includes(cls) ? cls : 'default');
    }

    function formatDuration(sec) {
        if (sec < 60) return sec.toFixed(0) + 's';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + 'm' + (s > 0 ? s + 's' : '');
    }

    function formatTime(ts) {
        return new Date(ts).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    }

    // --- Active session (live snapshots) ---
    async function loadActiveSession() {
        const res = await fetch('api/sessions', {cache: 'no-cache'});
        const data = await res.json();

        const all = [...(data.active || []), ...(data.recent || [])];
        let session;
        if (sessionID) {
            session = all.find(s => s.id === sessionID);
        } else {
            session = all.find(s => s.region === sessionRegion && s.class === sessionClass);
        }

        if (!session) {
            // Try stored sessions
            if (sessionID) {
                loadStoredSession(sessionID);
                return;
            }
            infoDiv.innerHTML = `No session found. <a href="events.html">Go back</a>`;
            return;
        }

        renderSessionInfo(session);

        if (session.active) {
            loadLiveSnapshots(session);
        } else if (session.id) {
            // Just ended — try stored snapshots
            loadStoredSession(session.id);
        }
    }

    function renderSessionInfo(session) {
        const statusClass = session.active ? 'status-active' : 'status-ended';
        const statusText = session.active ? 'ACTIVE' : 'ended';
        const dur = formatDuration(session.duration);
        const conf = (session.peak_confidence * 100).toFixed(0);
        const cameras = (session.cameras || [session.camera]).join(', ');

        infoDiv.innerHTML = `
            <span class="${tagClass(session.class)}">${session.class}</span>
            <span class="dur">${dur}</span>
            <span class="${statusClass}">${statusText}</span>
            <span class="meta">
                region: <b>${session.region}</b> &middot;
                cameras: <b>${cameras}</b> &middot;
                ${session.detection_count} detections &middot;
                ${conf}% peak &middot;
                started ${formatTime(session.start)}
                ${session.end ? ' &middot; ended ' + formatTime(session.end) : ''}
            </span>
        `;
    }

    async function loadLiveSnapshots(session) {
        const res = await fetch(`api/session/cameras?region=${encodeURIComponent(session.region)}`, {cache: 'no-cache'});
        const cameras = await res.json();

        timelineDiv.innerHTML = '<div style="color:#888; font-style:italic">Live — snapshots are being captured</div>';

        cameras.forEach(camName => {
            const src = encodeURIComponent(camName);
            let card = snapshotsDiv.querySelector(`.snap-card[data-camera="${camName}"]`);
            if (!card) {
                card = document.createElement('div');
                card.className = 'snap-card';
                card.dataset.camera = camName;
                card.innerHTML = `<img><div class="snap-label"></div><div class="snap-meta"></div>`;
                snapshotsDiv.appendChild(card);
            }

            const img = card.querySelector('img');
            if (document.getElementById('autorefresh').checked) {
                img.src = `api/snapshot/${src}?region=${encodeURIComponent(session.region)}&annotate=true&_t=${Date.now()}`;
            } else if (!img.src || img.src.includes('undefined')) {
                img.src = `api/snapshot/${src}?region=${encodeURIComponent(session.region)}&annotate=true`;
            }
            card.querySelector('.snap-label').textContent = camName;
            card.querySelector('.snap-meta').textContent = 'live';
        });
    }

    // --- Stored session (historical snapshots) ---
    async function loadStoredSession(id) {
        const res = await fetch(`api/sessions/snapshots?id=${encodeURIComponent(id)}`, {cache: 'no-cache'});
        if (!res.ok) {
            // Session still active or not yet saved
            infoDiv.innerHTML += ' <span style="color:#888">(snapshots not yet available)</span>';
            return;
        }

        const stored = await res.json();
        if (stored.session) {
            renderSessionInfo(stored.session);
        }

        const snaps = stored.snapshots || [];
        if (snaps.length === 0) {
            timelineDiv.innerHTML = '<div style="color:#888">No snapshots captured for this session</div>';
            return;
        }

        // Build timeline of thumbnails
        timelineDiv.innerHTML = '';
        snaps.forEach((snap, i) => {
            const item = document.createElement('div');
            item.className = 'timeline-item';
            const imgUrl = `api/sessions/snapshot/${encodeURIComponent(id)}/${encodeURIComponent(snap.filename)}`;
            item.innerHTML = `
                <img class="timeline-thumb${i === 0 ? ' selected' : ''}" src="${imgUrl}" data-index="${i}" data-url="${imgUrl}">
                <div class="timeline-time">${formatTime(snap.time)}</div>
            `;
            timelineDiv.appendChild(item);
        });

        // Show first snapshot large
        showStoredSnapshot(snaps[0], id);

        // Click timeline to switch
        timelineDiv.addEventListener('click', (e) => {
            const thumb = e.target.closest('.timeline-thumb');
            if (!thumb) return;
            const idx = parseInt(thumb.dataset.index);
            showStoredSnapshot(snaps[idx], id);
            timelineDiv.querySelectorAll('.timeline-thumb').forEach(t => t.classList.remove('selected'));
            thumb.classList.add('selected');
        });
    }

    function showStoredSnapshot(snap, sessionId) {
        const url = `api/sessions/snapshot/${encodeURIComponent(sessionId)}/${encodeURIComponent(snap.filename)}`;
        snapshotsDiv.innerHTML = `
            <div class="snap-card">
                <img src="${url}">
                <div class="snap-label">${snap.filename}</div>
                <div class="snap-meta">${formatTime(snap.time)}${snap.camera ? ' — ' + snap.camera : ''}</div>
            </div>
        `;
    }

    // --- Init ---
    if (!sessionRegion && !sessionClass && !sessionID) {
        infoDiv.innerHTML = 'Missing parameters. <a href="events.html">Go back</a>';
    } else {
        loadActiveSession();
        setInterval(() => {
            if (document.getElementById('autorefresh').checked) loadActiveSession();
        }, 2000);
    }
</script>

</body>
</html>
