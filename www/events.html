<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>events - go2rtc</title>
    <style>
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        #count { color: #888; }
        .region-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        .region-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 14px;
        }
        .region-card h4 {
            margin: 0 0 6px 0;
            font-size: 15px;
        }
        .region-card .cameras-list {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .region-card .det-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        .det-tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .det-tag.person { background: #e74c3c; }
        .det-tag.car { background: #3498db; }
        .det-tag.dog { background: #8e44ad; }
        .det-tag.cat { background: #27ae60; }
        .det-tag.bird { background: #16a085; }
        .det-tag.truck { background: #2c3e50; }
        .det-tag.default { background: #e67e22; }
        .region-card .quiet { color: #bbb; font-style: italic; font-size: 12px; }
        .sessions-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .session-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .session-row.active {
            border-color: #2ecc71;
            background: #f0faf4;
        }
        .session-row.ended {
            border-color: #eee;
            background: #fafafa;
        }
        .session-row .session-dur {
            font-family: monospace;
            font-weight: bold;
            min-width: 50px;
        }
        .session-row .session-meta {
            color: #666;
            font-size: 12px;
        }
        .session-row .session-time {
            color: #999;
            font-size: 11px;
            font-family: monospace;
            margin-left: auto;
            white-space: nowrap;
        }
        .sessions-header {
            font-weight: bold;
            margin-bottom: 6px;
        }
        .sessions-section { margin-bottom: 10px; }
    </style>
</head>
<body>

<script src="main.js"></script>

<main>
    <div class="filters">
        <b>Sessions</b>
        <select id="camera-filter">
            <option value="">all cameras</option>
        </select>
        <select id="region-filter">
            <option value="">all regions</option>
        </select>
        <label><input type="checkbox" id="live" checked> live updates</label>
        <span id="count"></span>
    </div>

    <div id="region-summary"></div>

    <div id="sessions-panel"></div>
</main>

<script>
    const cameraFilter = document.getElementById('camera-filter');
    const regionFilter = document.getElementById('region-filter');
    const regionSummary = document.getElementById('region-summary');
    const sessionsPanel = document.getElementById('sessions-panel');
    const countEl = document.getElementById('count');
    let knownCameras = new Set();
    let knownRegions = new Set();

    function detTagClass(cls) {
        const known = ['person','car','dog','cat','bird','truck'];
        return 'det-tag ' + (known.includes(cls) ? cls : 'default');
    }

    function formatTime(ts) {
        const d = new Date(ts);
        return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    }

    function formatDuration(sec) {
        if (sec < 60) return sec.toFixed(0) + 's';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + 'm' + (s > 0 ? s + 's' : '');
    }

    async function reload() {
        const res = await fetch('api/sessions', {cache: 'no-cache'});
        const data = await res.json();

        const camVal = cameraFilter.value;
        const regionVal = regionFilter.value;

        let active = data.active || [];
        let recent = data.recent || [];

        // Update filter dropdowns from session data
        [...active, ...recent].forEach(s => {
            if (s.camera && !knownCameras.has(s.camera)) {
                knownCameras.add(s.camera);
                const opt = document.createElement('option');
                opt.value = s.camera;
                opt.textContent = s.camera;
                cameraFilter.appendChild(opt);
            }
            if (s.region && !knownRegions.has(s.region)) {
                knownRegions.add(s.region);
                const opt = document.createElement('option');
                opt.value = s.region;
                opt.textContent = s.region;
                regionFilter.appendChild(opt);
            }
        });

        // Apply filters
        if (camVal) {
            active = active.filter(s => s.camera === camVal);
            recent = recent.filter(s => s.camera === camVal);
        }
        if (regionVal) {
            active = active.filter(s => s.region === regionVal);
            recent = recent.filter(s => s.region === regionVal);
        }

        // Sort: newest start at top
        active.sort((a, b) => new Date(b.start) - new Date(a.start));
        // Sort recent by end time descending (most recently ended on top)
        recent.sort((a, b) => new Date(b.end || b.last_seen) - new Date(a.end || a.last_seen));

        countEl.textContent = `${active.length} active, ${recent.length} previous`;

        // Build region summary from active sessions
        buildRegionSummary(active);

        // Render sessions
        let html = '';

        if (active.length > 0) {
            html += '<div class="sessions-section">';
            html += `<div class="sessions-header">Active Sessions (${active.length})</div>`;
            html += '<div class="sessions-list">';
            active.forEach(s => { html += renderSessionRow(s, true); });
            html += '</div></div>';
        }

        html += '<div class="sessions-section">';
        html += `<div class="sessions-header">Previous Sessions (${recent.length})</div>`;
        html += '<div class="sessions-list">';
        if (recent.length > 0) {
            recent.forEach(s => { html += renderSessionRow(s, false); });
        } else {
            html += '<div style="color:#bbb; font-style:italic; padding:6px 10px">no previous sessions</div>';
        }
        html += '</div></div>';

        sessionsPanel.innerHTML = html;
    }

    function renderSessionRow(s, isActive) {
        const dur = formatDuration(s.duration);
        const startTime = formatTime(s.start);
        const cls = isActive ? 'active' : 'ended';
        const conf = (s.peak_confidence * 100).toFixed(0);
        const endInfo = isActive ? '' : ` &middot; ended ${formatTime(s.end || s.last_seen)}`;
        const cameras = (s.cameras || [s.camera]).join(', ');
        const idParam = s.id ? `&id=${encodeURIComponent(s.id)}` : '';
        const href = `session.html?region=${encodeURIComponent(s.region)}&class=${encodeURIComponent(s.class)}${idParam}`;
        return `<a href="${href}" style="text-decoration:none; color:inherit">
        <div class="session-row ${cls}">
            <span class="${detTagClass(s.class)}">${s.class}</span>
            <span class="session-dur">${dur}</span>
            <span class="session-meta">${s.region} &middot; ${cameras} &middot; ${s.detection_count} det &middot; ${conf}%${endInfo}</span>
            <span class="session-time">${startTime}</span>
        </div></a>`;
    }

    function buildRegionSummary(activeSessions) {
        // Group active sessions by region
        const regions = {};
        activeSessions.forEach(s => {
            if (!s.region) return;
            if (!regions[s.region]) regions[s.region] = {cameras: new Set(), classes: {}};
            regions[s.region].cameras.add(s.camera);
            regions[s.region].classes[s.class] = (regions[s.region].classes[s.class] || 0) + 1;
        });

        const names = Object.keys(regions).sort();
        if (names.length === 0) {
            regionSummary.innerHTML = '';
            return;
        }

        regionSummary.innerHTML = '<div class="region-grid">' + names.map(name => {
            const r = regions[name];
            const cams = Array.from(r.cameras).join(', ');
            const tags = Object.entries(r.classes)
                .sort((a, b) => b[1] - a[1])
                .map(([cls, n]) => `<span class="${detTagClass(cls)}">${cls} ${n}</span>`)
                .join('');
            return `<div class="region-card" onclick="document.getElementById('region-filter').value='${name}'; reload();" style="cursor:pointer">
                <h4>${name}</h4>
                <div class="cameras-list">${cams}</div>
                <div class="det-tags">${tags}</div>
            </div>`;
        }).join('') + '</div>';
    }

    cameraFilter.addEventListener('change', reload);
    regionFilter.addEventListener('change', reload);

    reload();
    setInterval(() => {
        if (document.getElementById('live').checked) reload();
    }, 2000);
</script>

</body>
</html>
