<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>events - go2rtc</title>
    <style>
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .badge-detection { background: #e67e22; }
        .badge-state_change { background: #3498db; }
        .badge-group_detection { background: #9b59b6; }
        .badge-recording { background: #27ae60; }
        .correlated { color: #2a2; font-weight: bold; }
        .confidence { color: #666; font-size: 12px; }
        td.time { white-space: nowrap; font-family: monospace; font-size: 13px; }
        #count { color: #888; }
        .region-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
            margin-bottom: 10px;
        }
        .region-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 14px;
        }
        .region-card h4 {
            margin: 0 0 6px 0;
            font-size: 15px;
        }
        .region-card .cameras-list {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .region-card .det-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
        }
        .det-tag {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
        .det-tag.person { background: #e74c3c; }
        .det-tag.car { background: #3498db; }
        .det-tag.dog { background: #8e44ad; }
        .det-tag.cat { background: #27ae60; }
        .det-tag.bird { background: #16a085; }
        .det-tag.truck { background: #2c3e50; }
        .det-tag.default { background: #e67e22; }
        .region-card .quiet { color: #bbb; font-style: italic; font-size: 12px; }
        .sessions-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .session-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }
        .session-row.active {
            border-color: #2ecc71;
            background: #f0faf4;
        }
        .session-row.ended {
            border-color: #eee;
            background: #fafafa;
        }
        .session-row .session-dur {
            font-family: monospace;
            font-weight: bold;
            min-width: 50px;
        }
        .session-row .session-meta {
            color: #666;
            font-size: 12px;
        }
        .session-row .session-time {
            color: #999;
            font-size: 11px;
            font-family: monospace;
            margin-left: auto;
            white-space: nowrap;
        }
        .sessions-header {
            font-weight: bold;
            margin-bottom: 6px;
        }
        .sessions-section { margin-bottom: 10px; }
    </style>
</head>
<body>

<script src="main.js"></script>

<main>
    <div class="filters">
        <b>Events</b>
        <select id="type-filter">
            <option value="">all types</option>
            <option value="detection">detection</option>
            <option value="state_change">state_change</option>
            <option value="group_detection">group_detection</option>
        </select>
        <select id="camera-filter">
            <option value="">all cameras</option>
        </select>
        <select id="region-filter">
            <option value="">all regions</option>
        </select>
        <label><input type="checkbox" id="live" checked> live updates</label>
        <span id="count"></span>
    </div>

    <div id="region-summary"></div>

    <div id="sessions-panel" style="margin-bottom:10px"></div>

    <table>
        <thead>
        <tr>
            <th>time</th>
            <th>type</th>
            <th>camera</th>
            <th>details</th>
        </tr>
        </thead>
        <tbody id="events"></tbody>
    </table>
</main>

<script>
    const tbody = document.getElementById('events');
    const typeFilter = document.getElementById('type-filter');
    const cameraFilter = document.getElementById('camera-filter');
    const regionFilter = document.getElementById('region-filter');
    const regionSummary = document.getElementById('region-summary');
    const countEl = document.getElementById('count');
    let knownCameras = new Set();
    let knownRegions = new Set();

    function badgeClass(type) {
        return 'badge badge-' + (type || '').replace(/[^a-z_]/g, '');
    }

    function detTagClass(cls) {
        const known = ['person','car','dog','cat','bird','truck'];
        return 'det-tag ' + (known.includes(cls) ? cls : 'default');
    }

    function formatTime(ts) {
        const d = new Date(ts);
        return d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
    }

    function formatDetails(ev) {
        const data = ev.data;
        if (!data) return '';

        if (ev.type === 'detection' && data.detections) {
            const dets = data.detections.map(d =>
                `<span class="${detTagClass(d.class)}">${d.class} ${(d.confidence * 100).toFixed(0)}%</span>`
            ).join(' ');
            const region = data.region ? ` <span class="confidence">[${data.region}]</span>` : '';
            return dets + region;
        }

        if (ev.type === 'group_detection') {
            const corr = data.correlated
                ? '<span class="correlated">correlated</span>'
                : 'single';
            return `${data.class} ${corr} (${(data.cameras || []).join(', ')})`;
        }

        if (ev.type === 'state_change') {
            return data.online ? 'online' : 'offline' + (data.last_error ? ': ' + data.last_error : '');
        }

        return JSON.stringify(data).substring(0, 100);
    }

    async function reload() {
        const url = new URL('api/events', location.href);
        const type = typeFilter.value;
        const cam = cameraFilter.value;
        if (type) url.searchParams.set('type', type);
        if (cam) url.searchParams.set('camera', cam);

        const res = await fetch(url, {cache: 'no-cache'});
        const allEvents = await res.json();

        // Update filter dropdowns
        allEvents.forEach(e => {
            if (e.camera && !knownCameras.has(e.camera)) {
                knownCameras.add(e.camera);
                const opt = document.createElement('option');
                opt.value = e.camera;
                opt.textContent = e.camera;
                cameraFilter.appendChild(opt);
            }
            if (e.data && e.data.region && !knownRegions.has(e.data.region)) {
                knownRegions.add(e.data.region);
                const opt = document.createElement('option');
                opt.value = e.data.region;
                opt.textContent = e.data.region;
                regionFilter.appendChild(opt);
            }
        });

        // Apply region filter client-side
        const regionVal = regionFilter.value;
        const filtered = regionVal
            ? allEvents.filter(e => e.data && e.data.region === regionVal)
            : allEvents;

        countEl.textContent = `${filtered.length} events`;

        // Build region summary from last 60 seconds
        buildRegionSummary(allEvents);

        // Render table newest first
        const reversed = filtered.slice().reverse();
        tbody.innerHTML = reversed.map(ev => `
            <tr>
                <td class="time">${formatTime(ev.timestamp)}</td>
                <td><span class="${badgeClass(ev.type)}">${ev.type}</span></td>
                <td>${ev.camera || ''}</td>
                <td>${formatDetails(ev)}</td>
            </tr>
        `).join('');
    }

    function buildRegionSummary(events) {
        const cutoff = Date.now() - 60000;
        // {region: {cameras: Set, classes: {class: count}}}
        const regions = {};

        events.forEach(ev => {
            if (ev.type !== 'detection' || !ev.data || !ev.data.region) return;
            if (new Date(ev.timestamp).getTime() < cutoff) return;

            const r = ev.data.region;
            if (!regions[r]) regions[r] = {cameras: new Set(), classes: {}};
            regions[r].cameras.add(ev.camera);
            (ev.data.detections || []).forEach(d => {
                regions[r].classes[d.class] = (regions[r].classes[d.class] || 0) + 1;
            });
        });

        const names = Object.keys(regions).sort();
        if (names.length === 0) {
            regionSummary.innerHTML = '';
            return;
        }

        regionSummary.innerHTML = '<div class="region-grid">' + names.map(name => {
            const r = regions[name];
            const cams = Array.from(r.cameras).join(', ');
            const tags = Object.entries(r.classes)
                .sort((a, b) => b[1] - a[1])
                .map(([cls, n]) => `<span class="${detTagClass(cls)}">${cls} ${n}</span>`)
                .join('');
            return `<div class="region-card" onclick="document.getElementById('region-filter').value='${name}'; reload();" style="cursor:pointer">
                <h4>${name}</h4>
                <div class="cameras-list">${cams}</div>
                <div class="det-tags">${tags || '<span class="quiet">quiet</span>'}</div>
            </div>`;
        }).join('') + '</div>';
    }

    const sessionsPanel = document.getElementById('sessions-panel');

    async function loadSessions() {
        const res = await fetch('api/sessions', {cache: 'no-cache'});
        const data = await res.json();

        // Sort newest start at top, oldest at bottom
        const active = (data.active || []).sort((a, b) =>
            new Date(b.start) - new Date(a.start));
        const recent = (data.recent || []).slice(-30).sort((a, b) =>
            new Date(b.start) - new Date(a.start));

        let html = '';

        if (active.length > 0) {
            html += '<div class="sessions-section">';
            html += `<div class="sessions-header">Active Sessions (${active.length})</div>`;
            html += '<div class="sessions-list">';
            active.forEach(s => {
                html += renderSessionRow(s, true);
            });
            html += '</div></div>';
        }

        if (recent.length > 0) {
            html += '<div class="sessions-section">';
            html += `<div class="sessions-header">Previous Sessions (${recent.length})</div>`;
            html += '<div class="sessions-list">';
            recent.forEach(s => {
                html += renderSessionRow(s, false);
            });
            html += '</div></div>';
        }

        sessionsPanel.innerHTML = html;
    }

    function renderSessionRow(s, isActive) {
        const dur = formatDuration(s.duration);
        const startTime = formatTime(s.start);
        const cls = isActive ? 'active' : 'ended';
        const conf = (s.peak_confidence * 100).toFixed(0);
        return `<div class="session-row ${cls}">
            <span class="${detTagClass(s.class)}">${s.class}</span>
            <span class="session-dur">${dur}</span>
            <span class="session-meta">${s.region} &middot; ${s.camera} &middot; ${s.detection_count} det &middot; ${conf}%</span>
            <span class="session-time">${startTime}</span>
        </div>`;
    }

    function formatDuration(sec) {
        if (sec < 60) return sec.toFixed(0) + 's';
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + 'm' + (s > 0 ? s + 's' : '');
    }

    typeFilter.addEventListener('change', reload);
    cameraFilter.addEventListener('change', reload);
    regionFilter.addEventListener('change', reload);

    reload();
    loadSessions();
    setInterval(() => {
        if (document.getElementById('live').checked) {
            reload();
            loadSessions();
        }
    }, 2000);
</script>

</body>
</html>
